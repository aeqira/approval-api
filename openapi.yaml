openapi: 3.1.0

info:
  title: Approval API
  version: 1.3.0
  description: >
    Evaluates payment-plan proposals for delinquent loans. When a regular
    deferment is available, the API applies a three-month deferment before
    evaluating the remaining balance and delinquency. Production access is
    protected by Cloudflare Access.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: https://approval-api.aeqira.workers.dev
    description: Protected production Worker

security:
  - cloudflareAccessCookie: []

tags:
  - name: Health
    description: API availability and health information.
  - name: Approvals
    description: Payment-plan calculation and decision operations.
  - name: Managers
    description: Manager-review queue and decision operations.
  - name: Submissions
    description: Searchable payment-plan submission history for employees.

paths:
  /api/v1/health:
    get:
      tags:
        - Health
      summary: Check API health
      operationId: getHealth
      responses:
        "200":
          description: The API is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "403":
          description: Access denied by Cloudflare Access

  /api/v1/identity:
    get:
      tags:
        - Approvals
      summary: Get the authenticated user
      operationId: getIdentity
      responses:
        "200":
          description: Authenticated user identity and role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResponse"
        "401":
          description: An authenticated identity was not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied by Cloudflare Access

  /api/v1/approval:
    post:
      tags:
        - Approvals
      summary: Evaluate a payment-plan proposal
      operationId: evaluateApproval
      description: >
        Calculates the original delinquency, applies an available three-month
        regular deferment, evaluates the adjusted delinquency, saves the
        decision, and returns approved, denied, or manager_review. A deferment
        removes up to three regular monthly payments from the delinquent balance
        and subtracts 90 days from the delinquency. If both adjusted values reach
        zero, the request is automatically approved for deferment only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
            examples:
              minimumPlusExtra:
                summary: Minimum payment plus extra
                value:
                  memberNumber: "123456"
                  pastDueDate: "2026-09-09"
                  pastDueBalance: 650
                  monthlyPayment: 300
                  regularDefermentCount: 1
                  paymentChoice:
                    type: minimum_plus_extra
                    extraAmount: 100
              affordablePayment:
                summary: Affordable total payment
                value:
                  memberNumber: "123456"
                  pastDueDate: "2026-05-09"
                  pastDueBalance: 1200
                  monthlyPayment: 300
                  regularDefermentCount: 1
                  paymentChoice:
                    type: affordable_payment
                    affordablePayment: 400
      responses:
        "200":
          description: Approval decision saved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
              examples:
                defermentOnly:
                  summary: Approved for deferment only
                  value:
                    reviewId: "72b708ee-957b-466f-9cd6-fd3e09aca998"
                    status: approved
                    daysPastDue: 20
                    adjustedDaysPastDue: 0
                    adjustedPastDueBalance: 0
                    planPayment: 300
                    catchUpAmount: 0
                    numberOfPayments: 0
                    finalPayment: 300
                    regularDefermentAvailable: true
                    regularDefermentApplied: true
                    defermentMonths: 3
                    deferredAmount: 650
                    reasons:
                      - Approved for 3-month deferment only; no payment plan is required.
                    accountComment: >
                      Payment plan decision: APPROVED. Member number: 123456.
                      Due date: 2026-09-09. Original days delinquent: 20.
                      Adjusted days delinquent: 0. Original delinquent balance:
                      $650.00. Adjusted delinquent balance: $0.00. Regular
                      deferment applied for 3 months; $650.00 deferred. Plan
                      payment: $300.00. Payment count: 0. Final payment:
                      $300.00. Decision reason: Approved for 3-month deferment
                      only; no payment plan is required.
                approvedPlan:
                  summary: Approved payment plan after deferment
                  value:
                    reviewId: "3dfe09ac-a998-466f-9cd6-72b708ee957b"
                    status: approved
                    daysPastDue: 120
                    adjustedDaysPastDue: 30
                    adjustedPastDueBalance: 300
                    planPayment: 400
                    catchUpAmount: 100
                    numberOfPayments: 3
                    finalPayment: 400
                    regularDefermentAvailable: true
                    regularDefermentApplied: true
                    defermentMonths: 3
                    deferredAmount: 900
                    reasons:
                      - All automatic approval criteria were met.
                    accountComment: >
                      Payment plan decision: APPROVED. Member number: 123456.
                      Original days delinquent: 120. Adjusted days delinquent:
                      30. Original delinquent balance: $1200.00. Adjusted
                      delinquent balance: $300.00. Regular deferment applied
                      for 3 months; $900.00 deferred.
                managerReview:
                  summary: Manager review required
                  value:
                    reviewId: "f60570be-804b-4b80-8aac-3c2f10a2b676"
                    status: manager_review
                    daysPastDue: 45
                    adjustedDaysPastDue: 45
                    adjustedPastDueBalance: 1300
                    planPayment: 400
                    catchUpAmount: 100
                    numberOfPayments: 13
                    finalPayment: 400
                    regularDefermentAvailable: false
                    regularDefermentApplied: false
                    defermentMonths: 0
                    deferredAmount: 0
                    reasons:
                      - The loan remains between 31 and 89 days delinquent after deferment.
                      - The plan requires between 13 and 18 payments.
                    accountComment: >
                      Payment plan decision: MANAGER REVIEW. Member number:
                      123456. Original days delinquent: 45. Adjusted days
                      delinquent: 45. Original delinquent balance: $1300.00.
                      Adjusted delinquent balance: $1300.00. Regular deferment
                      not available.
                denied:
                  summary: Denied payment plan
                  value:
                    reviewId: "20dcd597-40e4-4d73-8a44-f0f3249d2719"
                    status: denied
                    daysPastDue: 90
                    adjustedDaysPastDue: 90
                    adjustedPastDueBalance: 1900
                    planPayment: 400
                    catchUpAmount: 100
                    numberOfPayments: 19
                    finalPayment: 400
                    regularDefermentAvailable: false
                    regularDefermentApplied: false
                    defermentMonths: 0
                    deferredAmount: 0
                    reasons:
                      - The loan remains 90 or more days delinquent after deferment.
                      - The plan requires more than 18 payments.
                    accountComment: >
                      Payment plan decision: DENIED. Member number: 123456.
                      Original days delinquent: 90. Adjusted days delinquent:
                      90. Original delinquent balance: $1900.00. Adjusted
                      delinquent balance: $1900.00. Regular deferment not
                      available.
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: An authenticated identity was not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied by Cloudflare Access
        "405":
          description: Method not allowed
          headers:
            Allow:
              schema:
                type: string
                const: POST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The approval review could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/submissions:
    get:
      tags:
        - Submissions
      summary: List payment-plan submissions
      operationId: listSubmissions
      description: >
        Returns paginated submission history for authenticated employees.
        Results can be searched by member number, employee display name, or
        employee email address.
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [approved, denied, manager_review]
        - name: defermentApplied
          in: query
          schema:
            type: boolean
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: sortBy
          in: query
          schema:
            type: string
            default: createdAt
            enum:
              - createdAt
              - memberNumber
              - status
              - daysPastDue
              - pastDueBalance
              - numberOfPayments
        - name: sortDirection
          in: query
          schema:
            type: string
            default: desc
            enum: [asc, desc]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Paginated submission history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalSubmissionsResponse"
        "400":
          description: Invalid filter, sort, or pagination value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: An authenticated identity was not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied by Cloudflare Access
        "405":
          description: Method not allowed
          headers:
            Allow:
              schema:
                type: string
                const: GET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Submission history could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/manager/reviews:
    get:
      tags:
        - Managers
      summary: List pending manager reviews
      operationId: listManagerReviews
      description: >
        Returns up to 100 pending payment plans in oldest-first order.
        The authenticated user must be an active manager.
      responses:
        "200":
          description: Pending manager reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerReviewsResponse"
        "401":
          description: An authenticated identity was not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The authenticated user is not an active manager
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Method not allowed
          headers:
            Allow:
              schema:
                type: string
                const: GET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Manager reviews could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/manager/reviews/{reviewId}:
    patch:
      tags:
        - Managers
      summary: Resolve a pending manager review
      operationId: resolveManagerReview
      description: >
        Approves or denies a pending manager review while preserving the
        API's original decision. The final account comment preserves the
        original API comment and appends the manager decision details.
      parameters:
        - name: reviewId
          in: path
          required: true
          description: Unique review identifier.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagerDecisionRequest"
            examples:
              approve:
                summary: Approve a pending review
                value:
                  status: approved
                  reason: Payment history supports approval.
              deny:
                summary: Deny a pending review
                value:
                  status: denied
                  reason: The proposed arrangement is not supportable.
      responses:
        "200":
          description: Manager decision saved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerDecisionResponse"
        "400":
          description: Invalid review ID, JSON, or decision request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: An authenticated identity was not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The authenticated user is not an active manager
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pending manager review not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Method not allowed
          headers:
            Allow:
              schema:
                type: string
                const: PATCH
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Manager decision could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    cloudflareAccessCookie:
      type: apiKey
      in: cookie
      name: CF_Authorization
      description: >
        Cloudflare Access session cookie supplied after the user signs in.

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - name
        - status
      properties:
        name:
          type: string
          examples:
            - Approval API
        status:
          type: string
          const: running

    IdentityResponse:
      type: object
      additionalProperties: false
      required:
        - email
        - displayName
        - role
      properties:
        email:
          type: string
          format: email
          description: Authenticated user email address.
          examples:
            - associate@aeqira.com
        displayName:
          type: string
          description: User name from the active users record, or the email address as a fallback.
          examples:
            - Andrew Richard
        role:
          type: string
          enum:
            - associate
            - manager
          description: Application role assigned to the authenticated user.

    ApprovalRequest:
      type: object
      additionalProperties: false
      required:
        - memberNumber
        - pastDueDate
        - pastDueBalance
        - monthlyPayment
        - regularDefermentCount
        - paymentChoice
      properties:
        memberNumber:
          type: string
          minLength: 1
          description: Member or account identifier.
          examples:
            - "123456"
        pastDueDate:
          type: string
          format: date
          description: >
            Date of the oldest unpaid payment. The date must be today or
            earlier. Days delinquent are calculated using UTC calendar dates.
          examples:
            - "2026-09-09"
        pastDueBalance:
          type: number
          exclusiveMinimum: 0
          description: Total delinquent balance.
          examples:
            - 650
        monthlyPayment:
          type: number
          exclusiveMinimum: 0
          description: Current regular monthly payment.
          examples:
            - 300
        regularDefermentCount:
          type: integer
          minimum: 0
          description: Lifetime number of regular deferments used.
          examples:
            - 1
        paymentChoice:
          oneOf:
            - $ref: "#/components/schemas/MinimumPlusExtra"
            - $ref: "#/components/schemas/AffordablePayment"
          discriminator:
            propertyName: type
            mapping:
              minimum_plus_extra: "#/components/schemas/MinimumPlusExtra"
              affordable_payment: "#/components/schemas/AffordablePayment"

    MinimumPlusExtra:
      type: object
      additionalProperties: false
      required:
        - type
        - extraAmount
      properties:
        type:
          type: string
          const: minimum_plus_extra
        extraAmount:
          type: number
          exclusiveMinimum: 0
          description: Amount paid above the regular monthly payment.

    AffordablePayment:
      type: object
      additionalProperties: false
      required:
        - type
        - affordablePayment
      properties:
        type:
          type: string
          const: affordable_payment
        affordablePayment:
          type: number
          exclusiveMinimum: 0
          description: Total monthly amount the member can afford.

    ApprovalResponse:
      type: object
      additionalProperties: false
      required:
        - reviewId
        - status
        - daysPastDue
        - adjustedDaysPastDue
        - adjustedPastDueBalance
        - planPayment
        - catchUpAmount
        - numberOfPayments
        - finalPayment
        - regularDefermentAvailable
        - regularDefermentApplied
        - defermentMonths
        - deferredAmount
        - reasons
        - accountComment
      properties:
        reviewId:
          type: string
          format: uuid
          description: Unique identifier for the saved approval review.
        status:
          type: string
          enum:
            - approved
            - denied
            - manager_review
        daysPastDue:
          type: integer
          minimum: 0
          description: Original number of calendar days delinquent.
        adjustedDaysPastDue:
          type: integer
          minimum: 0
          description: >
            Days delinquent remaining after subtracting 90 days when a
            regular deferment is applied.
        adjustedPastDueBalance:
          type: number
          minimum: 0
          description: >
            Delinquent balance remaining after subtracting up to three
            regular monthly payments.
        planPayment:
          type: number
          minimum: 0
          description: Total regular payment during the payment plan.
        catchUpAmount:
          type: number
          minimum: 0
          description: Amount above the monthly payment applied to delinquency.
        numberOfPayments:
          type: integer
          minimum: 0
          description: Number of payments required by the payment plan.
        finalPayment:
          type: number
          minimum: 0
          description: Final payment after applying the remaining balance.
        regularDefermentAvailable:
          type: boolean
          description: >
            Whether fewer than two lifetime regular deferments were used
            when the request was evaluated.
        regularDefermentApplied:
          type: boolean
          description: Whether a three-month regular deferment was applied.
        defermentMonths:
          type: integer
          enum:
            - 0
            - 3
          description: Number of months included in the applied deferment.
        deferredAmount:
          type: number
          minimum: 0
          description: Amount removed from delinquency by the deferment.
        reasons:
          type: array
          minItems: 1
          items:
            type: string
          description: Reasons supporting the returned decision.
        accountComment:
          type: string
          minLength: 1
          description: Paste-ready comment for the servicing system.

    ManagerReview:
      type: object
      additionalProperties: false
      required:
        - reviewId
        - memberNumber
        - associateEmail
        - associateDisplayName
        - pastDueDate
        - daysPastDue
        - adjustedDaysPastDue
        - pastDueBalance
        - adjustedPastDueBalance
        - monthlyPayment
        - planPayment
        - numberOfPayments
        - regularDefermentAvailable
        - regularDefermentApplied
        - defermentMonths
        - deferredAmount
        - reasons
        - createdAt
      properties:
        reviewId:
          type: string
          format: uuid
        memberNumber:
          type: string
        associateEmail:
          type: string
          format: email
        associateDisplayName:
          type: string
          description: Employee name from the users table, or their email as a fallback.
        pastDueDate:
          type: string
          format: date
        daysPastDue:
          type: integer
          minimum: 0
          description: Original number of calendar days delinquent.
        adjustedDaysPastDue:
          type: integer
          minimum: 0
          description: Days delinquent remaining after deferment.
        pastDueBalance:
          type: number
          minimum: 0
          description: Original delinquent balance.
        adjustedPastDueBalance:
          type: number
          minimum: 0
          description: Delinquent balance remaining after deferment.
        monthlyPayment:
          type: number
          minimum: 0
        planPayment:
          type: number
          minimum: 0
        numberOfPayments:
          type: integer
          minimum: 0
        regularDefermentAvailable:
          type: boolean
        regularDefermentApplied:
          type: boolean
        defermentMonths:
          type: integer
          enum:
            - 0
            - 3
        deferredAmount:
          type: number
          minimum: 0
        reasons:
          type: array
          minItems: 1
          items:
            type: string
        createdAt:
          type: string
          description: D1 creation timestamp.

    ManagerReviewsResponse:
      type: object
      additionalProperties: false
      required:
        - reviews
      properties:
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/ManagerReview"

    ManagerDecisionRequest:
      type: object
      additionalProperties: false
      required:
        - status
        - reason
      properties:
        status:
          type: string
          enum:
            - approved
            - denied
        reason:
          type: string
          minLength: 1
          maxLength: 1000

    ManagerDecisionResponse:
      type: object
      additionalProperties: false
      required:
        - reviewId
        - status
        - managerEmail
        - managerDisplayName
        - managerReason
        - accountComment
        - reviewedAt
      properties:
        reviewId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - approved
            - denied
        managerEmail:
          type: string
          format: email
        managerDisplayName:
          type: string
        managerReason:
          type: string
        accountComment:
          type: string
          description: >
            Final paste-ready account comment containing the complete original
            API comment followed by the manager decision, manager name, and reason.
        reviewedAt:
          type: string
          format: date-time

    ApprovalSubmission:
      type: object
      additionalProperties: false
      required:
        - reviewId
        - memberNumber
        - associateEmail
        - associateDisplayName
        - pastDueDate
        - daysPastDue
        - adjustedDaysPastDue
        - pastDueBalance
        - adjustedPastDueBalance
        - monthlyPayment
        - planPayment
        - numberOfPayments
        - regularDefermentApplied
        - defermentMonths
        - deferredAmount
        - initialStatus
        - currentStatus
        - reasons
        - managerEmail
        - managerReason
        - reviewedAt
        - createdAt
        - accountComment
      properties:
        reviewId:
          type: string
          format: uuid
        memberNumber:
          type: string
        associateEmail:
          type: string
          format: email
        associateDisplayName:
          type: string
        pastDueDate:
          type: string
          format: date
        daysPastDue:
          type: integer
          minimum: 0
        adjustedDaysPastDue:
          type: integer
          minimum: 0
        pastDueBalance:
          type: number
          minimum: 0
        adjustedPastDueBalance:
          type: number
          minimum: 0
        monthlyPayment:
          type: number
          minimum: 0
        planPayment:
          type: number
          minimum: 0
        numberOfPayments:
          type: integer
          minimum: 0
        regularDefermentApplied:
          type: boolean
        defermentMonths:
          type: integer
          enum: [0, 3]
        deferredAmount:
          type: number
          minimum: 0
        initialStatus:
          type: string
          enum: [approved, denied, manager_review]
        currentStatus:
          type: string
          enum: [approved, denied, manager_review]
        reasons:
          type: array
          items:
            type: string
        managerEmail:
          oneOf:
            - type: string
              format: email
            - type: "null"
        managerReason:
          oneOf:
            - type: string
            - type: "null"
        reviewedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        createdAt:
          type: string
          description: D1 creation timestamp.
        accountComment:
          type: string

    ApprovalSubmissionsResponse:
      type: object
      additionalProperties: false
      required:
        - submissions
        - total
        - page
        - pageSize
        - totalPages
      properties:
        submissions:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalSubmission"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalPages:
          type: integer
          minimum: 1

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
        requiredFields:
          type: array
          items:
            type: string
